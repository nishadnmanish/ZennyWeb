plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zennyweb.browser'
    compileSdk 37

    defaultConfig {
        applicationId 'com.zennyweb.browser'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:158.0.20261019185856'
}

configurations.configureEach {
    resolutionStrategy {
        force 'androidx.core:core:1.18.0'
        force 'androidx.core:core-ktx:1.18.0'
    }
}
